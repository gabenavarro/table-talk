# table-talk dashboard configuration. Every value below is the built-in
# default (see bin/tt_config.py DEFAULTS) — copy this file to
# ~/.config/table-talk/config.toml, or point TABLE_TALK_CONFIG at a copy,
# and change only what you want to override. A missing or malformed file
# just falls back to these defaults; it never stops the dashboard starting.

# The data directory itself is not a config key — it comes from the
# TABLE_TALK_DIR environment variable (default ~/.local/share/table-talk), read
# by both the CLI and the dashboard, so `TABLE_TALK_DIR=docs/demo table-talk
# serve` shows a different set of logs without touching your own.

[server]
# host: "127.0.0.1" keeps the dashboard on this machine. "0.0.0.0" serves it on
# every interface so a phone or another computer on your network can open it -
# there is NO password on this page, so anyone who can reach the port reads your
# work log, project names and file paths. Local networks include shared wifi.
# Jobs (the drawer's `job` button) are disabled unless this is "127.0.0.1".
host = "127.0.0.1"
port = 8731             # dashboard HTTP port
poll_seconds = 2.0       # how often the dashboard re-reads the log files

[ui]
view = "merged"         # wall layout: "merged" (one card per project, rows tagged
                        # with the session that recorded them) or "flat" (one card
                        # per session file). Press u to switch without editing this.
columns = 0                                # wall column count; 0 = auto-fit to window width
drawer_open = true                         # whether the session drawer starts open
filter_debounce_ms = 100                   # delay before the filter box re-renders as you type
collapsed_sections = ["glossary", "done"]  # window sections that start folded ("actions", "jobs", "diagrams", "glossary", "done")

[links]
open_command = "xdg-open"  # command used to open a clicked path, e.g. "code" or "$EDITOR"
                            # (default: "open" on macOS, "xdg-open" elsewhere)
extra_roots = []            # extra directories a clicked path may resolve under

[theme]
default = "system"  # "system", "dark", or "light"

# Name a bundled palette from bin/themes.json; "" keeps the built-in one. The
# [theme.dark] / [theme.light] tokens below still win, so you can take a theme
# and change a single colour without restating the other sixteen.
#   dark:  Catppuccin Mocha, Dracula, Everforest Dark Hard, Gruvbox Dark Hard, Kanagawa Wave, Nord, Rose Pine, TokyoNight Night
#   light: Ayu Light, Catppuccin Latte, Everforest Light Hard, Gruvbox Light Hard, Nord Light, Rose Pine Dawn, TokyoNight Day
dark_theme = ""
light_theme = ""

# Colour tokens below are hex strings (#rgb, #rgba, #rrggbb, #rrggbbaa) fed
# straight into the stylesheet; override any subset, the rest keep their default.
[theme.dark]
bg = "#1d2021"
surface = "#282828"
surface-2 = "#32302f"
ink = "#ebdbb2"
ink-2 = "#a89984"
ink-3 = "#928374"
sel = "#665c54"
caret = "#8ec07c"
act = "#fb4934"
act-2 = "#cc241d"
job = "#83a598"
job-2 = "#458588"
gls = "#fabd2f"
gls-2 = "#d79921"
ok = "#b8bb26"
ok-2 = "#98971a"
mag = "#d3869b"

[theme.light]
bg = "#e8e6dc"
surface = "#faf9f5"
surface-2 = "#f2f0e8"
ink = "#141413"
ink-2 = "#6f6e68"
ink-3 = "#727169"
sel = "#e8e6dc"
caret = "#c4512c"
act = "#a53a2e"
act-2 = "#d97757"
job = "#3668a0"
job-2 = "#6a9bcc"
gls = "#8a6a10"
